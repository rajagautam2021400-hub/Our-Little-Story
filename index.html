<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Something ✨</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <!-- FIRST PAGE -->
    <main class="welcome">

        <div class="card">

            <div class="sparkle">✦</div>

            <h1>For Someone Special</h1>

            <p class="subtitle">
                Some things are better shown<br>
                than explained...
            </p>

            <div class="heart">♡</div>

            <button onclick="openStory()">
                Open ✨
            </button>

        </div>

    </main>


    <!-- SECOND PAGE -->
    <section class="message-section" id="story">

        <div class="message-card">

            <span class="small-title">
                A little message 💌
            </span>

            <h2>
                Some people make ordinary moments special.
            </h2>

            <p>
                This little corner of the internet is made
                just to keep a few beautiful thoughts and
                memories in one place.
            </p>

            <div class="divider">✦</div>

            <p class="ending">
                And this is only the beginning... ✨
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
